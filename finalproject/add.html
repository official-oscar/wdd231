<main><h1>Suggest a Movie/Song</h1>
<form method="get" action="form-action.html" class="form">
<label for="title">Title *<input type="text" id="title" name="title" required></label>

<label for="name">Your Name *<input type="text" id="name" name="name" required autocomplete="name"></label>
<label for="email">Email *<input type="email" id="email" name="email" required autocomplete="email"></label>
<label for="reason">Why should we add it?<textarea id="reason" name="reason" rows="4" required></textarea></label>
<input type="submit" value="Submit Suggestion" class="cta">
</form></main>
