<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WDD 231 Course Home Page for Uwagboe" />
    <meta name="author" content="Osarugue Uwagboe" />
    <title>WDD 231: Course Home Page - Osarugue Uwagboe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/normalize.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/larger.css" />

    <script src="scripts/navigation.js" defer></script>
    <script src="scripts/date.js" defer></script>
    <script src="scripts/course.js" defer></script>
  </head>
  <body>
    <header>
      <img src="images/logo.svg" alt="Site Logo" width="50" height="50" />
      <span>Osarugue Uwagboe</span>
      <button id="hamburger" aria-label="Toggle Navigation">☰</button>
    </header>

    <nav id="navigation">
      <ul>
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="#">Chamber</a></li>
        <li><a href="#">Final</a></li>
      </ul>
    </nav>

    <main>
      <h1>Home</h1>

      <section>
        <h2>Course Work</h2>
        <ul>
          <li></li>
          <li></li>
          <li></li>
        </ul>
      </section>

      <section>
        <h2>Nigeria</h2>
        <figure>
          <img
            src="images/nigeria.jpg"
            alt="Photo of Nigeria"
            loading="lazy"
            width="300"
          />
          <figcaption>Nigeria</figcaption>
        </figure>
      </section>

      <section>
        <h2>Web and Computer Programming Certificate</h2>
        <div class="filter-buttons">
          <button id="all">All Courses</button>
          <button id="wdd">WDD Courses</button>
          <button id="cse">CSE Courses</button>
        </div>
        <div id="course-cards"></div>
        <p>Total Credits: <span id="total-credits">0</span></p>
      </section>
    </main>

    <footer>
      <div class="social">
        <a
          href="https://github.com/yourusername"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub"
        >
          <img
            src="images/github.svg"
            alt="GitHub Logo"
            width="24"
            height="24"
          />
        </a>
        <a
          href="https://linkedin.com/in/yourusername"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn"
        >
          <img
            src="images/linkedin.svg"
            alt="LinkedIn Logo"
            width="24"
            height="24"
          />
        </a>
      </div>
      <p>© <span id="currentyear"></span> Osarugue Uwagboe - Nigeria</p>
      <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
  </body>
</html>
